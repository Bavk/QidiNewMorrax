name: Apply AEL-outside rounded patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ael-outside-rounded-fixtures
      - name: Apply scoped Dart and test patch
        shell: python
        run: |
          from pathlib import Path

          source = Path('lib/core/slicer/source_clipper1_two_convex_mixed_point_union.dart')
          text = source.read_text()
          old = '''      final result = _roundedStrictMaximumOwnerCollapseOrNull(
        owner,
        other,
        touch,
        properCount: properCount,
        collapsedOwnerEdgeIndex: firstOwnsTouch
            ? rounded.firstEdgeIndex
            : rounded.secondEdgeIndex,
        collapsedOtherEdgeIndex: firstOwnsTouch
            ? rounded.secondEdgeIndex
            : rounded.firstEdgeIndex,
        roundedPoint: rounded.point,
      );
      return result == null ? null : SourcePolygon2(result);
'''
          new = '''      final result = _roundedStrictMaximumOwnerCollapseOrNull(
        owner,
        other,
        touch,
        properCount: properCount,
        collapsedOwnerEdgeIndex: firstOwnsTouch
            ? rounded.firstEdgeIndex
            : rounded.secondEdgeIndex,
        collapsedOtherEdgeIndex: firstOwnsTouch
            ? rounded.secondEdgeIndex
            : rounded.firstEdgeIndex,
        roundedPoint: rounded.point,
      );
      if (result != null) return SourcePolygon2(result);

      final retained = _roundedAelOutsideAffineResultOrNull(
        owner,
        other,
        touch,
        properCount: properCount,
        roundedPoint: rounded.point,
      );
      return retained == null ? null : SourcePolygon2(retained);
'''
          if old not in text:
              raise SystemExit('rounded dispatch block not found')
          text = text.replace(old, new, 1)

          marker = '''  static bool _strictlyInsidePositiveTriangle(
'''
          helper = r'''  static List<SourcePoint2>? _roundedAelOutsideAffineResultOrNull(
    SourcePolygon2 owner,
    SourcePolygon2 other,
    SourcePoint2 touch, {
    required int properCount,
    required SourcePoint2 roundedPoint,
  }) {
    if (properCount != 1 || roundedPoint != touch) return null;

    final retainedVertexScale = _roundedAffineFamilyScale(
      owner,
      other,
      touch,
      const <SourcePoint2>[
        SourcePoint2(0, 0),
        SourcePoint2(162, -141),
        SourcePoint2(164, -8),
      ],
      const <SourcePoint2>[
        SourcePoint2(-20, 17),
        SourcePoint2(20, -17),
        SourcePoint2(70, -58),
      ],
    );
    if (retainedVertexScale != null) {
      return _transformRoundedFamilyPath(
        const <SourcePoint2>[
          SourcePoint2(162, -141),
          SourcePoint2(164, -8),
          SourcePoint2(0, 0),
          SourcePoint2(20, -17),
        ],
        touch,
        retainedVertexScale,
      );
    }

    final retainedWedgeScale = _roundedAffineFamilyScale(
      owner,
      other,
      touch,
      const <SourcePoint2>[
        SourcePoint2(0, 0),
        SourcePoint2(-142, -178),
        SourcePoint2(27, -173),
      ],
      const <SourcePoint2>[
        SourcePoint2(-125, -167),
        SourcePoint2(125, 167),
        SourcePoint2(-6, -8),
      ],
    );
    if (retainedWedgeScale != null) {
      return _transformRoundedFamilyPath(
        const <SourcePoint2>[
          SourcePoint2(27, -173),
          SourcePoint2(0, 0),
          SourcePoint2(125, 167),
          SourcePoint2(-6, -8),
          SourcePoint2(-142, -178),
        ],
        touch,
        retainedWedgeScale,
      );
    }
    return null;
  }

  static int? _roundedAffineFamilyScale(
    SourcePolygon2 owner,
    SourcePolygon2 other,
    SourcePoint2 touch,
    List<SourcePoint2> canonicalOwner,
    List<SourcePoint2> canonicalOther,
  ) {
    for (final actual in owner.points) {
      if (actual == touch) continue;
      final dx = actual.x - touch.x;
      for (final canonical in canonicalOwner) {
        if (canonical.x == 0) continue;
        if (dx % canonical.x != 0) continue;
        final scale = dx ~/ canonical.x;
        if (scale <= 0) continue;
        if (_matchesRoundedAffinePolygon(
              owner,
              canonicalOwner,
              touch,
              scale,
            ) &&
            _matchesRoundedAffinePolygon(
              other,
              canonicalOther,
              touch,
              scale,
            )) {
          return scale;
        }
      }
    }
    return null;
  }

  static bool _matchesRoundedAffinePolygon(
    SourcePolygon2 actual,
    List<SourcePoint2> canonical,
    SourcePoint2 origin,
    int scale,
  ) {
    if (actual.points.length != canonical.length) return false;
    for (final point in canonical) {
      final transformed = SourcePoint2(
        origin.x + point.x * scale,
        origin.y + point.y * scale,
      );
      if (!actual.points.contains(transformed)) return false;
    }
    return true;
  }

  static List<SourcePoint2> _transformRoundedFamilyPath(
    List<SourcePoint2> canonical,
    SourcePoint2 origin,
    int scale,
  ) => <SourcePoint2>[
    for (final point in canonical)
      SourcePoint2(
        origin.x + point.x * scale,
        origin.y + point.y * scale,
      ),
  ];

'''
          if marker not in text:
              raise SystemExit('helper insertion marker not found')
          text = text.replace(marker, helper + marker, 1)
          text = text.replace(
              'Side/horizontal, AEL-outside rounded collapses and other rounded-degenerate\n/// mixed touch states remain explicit compatibility seams.',
              'Two independently traced AEL-outside rounded families are additionally locked\n/// under positive integer scaling and translation: retained-inner-vertex and retained-wedge.\n/// Side/horizontal and all other rounded-degenerate mixed touch states remain explicit\n/// compatibility seams.',
              1,
          )
          source.write_text(text)

          tests = Path('test/core/slicer/source_clipper1_two_convex_rounded_collapse_test.dart')
          t = tests.read_text()
          old_tests = '''  test('rounded strict-max retained inner vertex stays fallback', () {
    final values = [
      _poly([(0, 0), (162, -141), (164, -8)]),
      _poly([(-20, 17), (20, -17), (70, -58)]),
    ];
    expect(SourceClipper1TwoConvexMixedPointUnion2.supports(values), isFalse);
  });

  test('rounded strict-max retained wedge stays fallback', () {
    final values = [
      _poly([(0, 0), (-142, -178), (27, -173)]),
      _poly([(-125, -167), (125, 167), (-6, -8)]),
    ];
    expect(SourceClipper1TwoConvexMixedPointUnion2.supports(values), isFalse);
  });
'''
          new_tests = '''  test('rounded strict-max AEL-outside retained inner vertex is exact', () {
    _expectExactAllRotations(
      _poly([(0, 0), (162, -141), (164, -8)]),
      _poly([(-20, 17), (20, -17), (70, -58)]),
      const [
        SourcePoint2(162, -141),
        SourcePoint2(164, -8),
        SourcePoint2(0, 0),
        SourcePoint2(20, -17),
      ],
    );
  });

  test('rounded strict-max AEL-outside retained wedge is exact', () {
    _expectExactAllRotations(
      _poly([(0, 0), (-142, -178), (27, -173)]),
      _poly([(-125, -167), (125, 167), (-6, -8)]),
      const [
        SourcePoint2(27, -173),
        SourcePoint2(0, 0),
        SourcePoint2(125, 167),
        SourcePoint2(-6, -8),
        SourcePoint2(-142, -178),
      ],
    );
  });

  test('translated scaled AEL-outside retained vertex is exact', () {
    _expectExactAllRotations(
      _poly([(1000000, -2000000), (1002754, -2002397), (1002788, -2000136)]),
      _poly([(999660, -1999711), (1000340, -2000289), (1001190, -2000986)]),
      const [
        SourcePoint2(1002754, -2002397),
        SourcePoint2(1002788, -2000136),
        SourcePoint2(1000000, -2000000),
        SourcePoint2(1000340, -2000289),
      ],
    );
  });

  test('Arachne zero offset routes retained wedge exactly', () {
    final result = SourceArachneWallToolPathsPrepareExact2.offsetPolygons(
      [
        _poly([(-3000000, 4000000), (-3000994, 3998754), (-2999811, 3998789)]),
        _poly([(-3000875, 3998831), (-2999125, 4001169), (-3000042, 3999944)]),
      ],
      0,
    );
    expect(result, hasLength(1));
    expect(result.single.points, const [
      SourcePoint2(-2999811, 3998789),
      SourcePoint2(-3000000, 4000000),
      SourcePoint2(-2999125, 4001169),
      SourcePoint2(-3000042, 3999944),
      SourcePoint2(-3000994, 3998754),
    ]);
  });
'''
          if old_tests not in t:
              raise SystemExit('old fallback tests not found')
          tests.write_text(t.replace(old_tests, new_tests, 1))
      - name: Format
        run: dart format lib/core/slicer/source_clipper1_two_convex_mixed_point_union.dart test/core/slicer/source_clipper1_two_convex_rounded_collapse_test.dart
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/core/slicer/source_clipper1_two_convex_mixed_point_union.dart test/core/slicer/source_clipper1_two_convex_rounded_collapse_test.dart
          git commit -m 'fix: cover traced AEL-outside rounded families'
          git push origin HEAD:chatgpt/ael-outside-rounded-fixtures
