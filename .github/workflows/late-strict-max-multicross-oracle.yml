name: Late strict-max multicross oracle

on:
  push:
    branches: [chatgpt/late-strict-max-multicross]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Eigen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeigen3-dev

      - name: Build and run pinned Clipper1 probes
        shell: bash
        run: |
          set -euxo pipefail
          PIN=f2b55a5a83f266cf56e06c7943a81a08bebb7fad
          mkdir -p oracle/src/clipper oracle/src/libslic3r
          curl -fsSL "https://raw.githubusercontent.com/bambulab/BambuStudio/${PIN}/src/clipper/clipper.cpp" -o oracle/src/clipper/clipper.cpp
          curl -fsSL "https://raw.githubusercontent.com/bambulab/BambuStudio/${PIN}/src/clipper/clipper.hpp" -o oracle/src/clipper/clipper.hpp
          curl -fsSL "https://raw.githubusercontent.com/bambulab/BambuStudio/${PIN}/src/libslic3r/Int128.hpp" -o oracle/src/libslic3r/Int128.hpp
          g++ -std=c++17 -O2 -Ioracle/src -I/usr/include/eigen3 oracle/src/clipper/clipper.cpp tools/late_strict_max_multicross_probe.cpp -o oracle/late_strict_max_multicross_probe
          ./oracle/late_strict_max_multicross_probe
          g++ -std=c++17 -O2 -Ioracle/src -I/usr/include/eigen3 oracle/src/clipper/clipper.cpp tools/late_strict_max_multicross_targeted_probe.cpp -o oracle/late_strict_max_multicross_targeted_probe
          ./oracle/late_strict_max_multicross_targeted_probe

      - name: Apply proved extension and remove temporary probes
        shell: bash
        run: |
          set -euxo pipefail
          echo '' | base64 -d | python3
          rm -f tools/late_strict_max_multicross_probe.cpp
          rm -f tools/late_strict_max_multicross_targeted_probe.cpp
          rm -f .github/workflows/late-strict-max-multicross-oracle.yml
          git config user.name Bavk
          git config user.email denmurdok@gmail.com
          git add -A
          git diff --cached --check
          git commit -m 'feat: extend late strict-max multicross joins'
          git push origin HEAD:chatgpt/late-strict-max-multicross
