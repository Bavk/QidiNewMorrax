name: Apply single-cross separated-min patch

on:
  push:
    branches: [chatgpt/rounded-strict-max]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci: apply single-cross separated-min implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply proved patch and self-clean
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/apply_single_cross_separated_min_patch.py
          rm -f tools/apply_single_cross_separated_min_patch.py
          rm -f tools/late_strict_max_single_cross_separated_min_probe.cpp
          rm -f .github/workflows/late-strict-max-single-cross-separated-min-oracle.yml
          rm -f .github/workflows/apply-single-cross-separated-min-patch.yml
          git config user.name Bavk
          git config user.email denmurdok@gmail.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: cover strict-max single-cross separated minima'
          git push origin HEAD:chatgpt/rounded-strict-max
