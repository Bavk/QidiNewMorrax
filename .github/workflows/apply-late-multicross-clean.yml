name: Apply late multicross patch

on:
  push:
    branches: [chatgpt/late-strict-max-multicross]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply proved patch and clean temporary oracle files
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/apply_late_multicross.py
          rm -f tools/apply_late_multicross.py
          rm -f tools/late_strict_max_multicross_probe.cpp
          rm -f tools/late_strict_max_multicross_targeted_probe.cpp
          rm -f .github/workflows/late-strict-max-multicross-oracle.yml
          rm -f .github/workflows/apply-late-multicross-clean.yml
          git config user.name Bavk
          git config user.email denmurdok@gmail.com
          git add -A
          git diff --cached --check
          git commit -m 'feat: extend late strict-max multicross joins'
          git push origin HEAD:chatgpt/late-strict-max-multicross
