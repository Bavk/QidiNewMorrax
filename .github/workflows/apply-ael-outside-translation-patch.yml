name: Apply translation-only AEL-outside patch

on:
  push:
    branches:
      - chatgpt/ael-outside-rounded-fixtures
    paths:
      - .github/workflows/apply-ael-outside-translation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ael-outside-rounded-fixtures
      - name: Apply scoped Dart and tests
        shell: python
        run: |
          from pathlib import Path

          source = Path('lib/core/slicer/source_clipper1_two_convex_mixed_point_union.dart')
          text = source.read_text()
          old = '''      final result = _roundedStrictMaximumOwnerCollapseOrNull(
        owner,
        other,
        touch,
        properCount: properCount,
        collapsedOwnerEdgeIndex: firstOwnsTouch
            ? rounded.firstEdgeIndex
            : rounded.secondEdgeIndex,
        collapsedOtherEdgeIndex: firstOwnsTouch
            ? rounded.secondEdgeIndex
            : rounded.firstEdgeIndex,
        roundedPoint: rounded.point,
      );
      return result == null ? null : SourcePolygon2(result);
'''
          new = '''      final result = _roundedStrictMaximumOwnerCollapseOrNull(
        owner,
        other,
        touch,
        properCount: properCount,
        collapsedOwnerEdgeIndex: firstOwnsTouch
            ? rounded.firstEdgeIndex
            : rounded.secondEdgeIndex,
        collapsedOtherEdgeIndex: firstOwnsTouch
            ? rounded.secondEdgeIndex
            : rounded.firstEdgeIndex,
        roundedPoint: rounded.point,
      );
      if (result != null) return SourcePolygon2(result);
      final retained = _roundedAelOutsideTranslatedResultOrNull(
        owner,
        other,
        touch,
        properCount: properCount,
        roundedPoint: rounded.point,
      );
      return retained == null ? null : SourcePolygon2(retained);
'''
          if old not in text:
              raise SystemExit('rounded dispatch block not found')
          text = text.replace(old, new, 1)

          marker = '''  static bool _strictlyInsidePositiveTriangle(
'''
          helper = r'''  static List<SourcePoint2>? _roundedAelOutsideTranslatedResultOrNull(
    SourcePolygon2 owner,
    SourcePolygon2 other,
    SourcePoint2 touch, {
    required int properCount,
    required SourcePoint2 roundedPoint,
  }) {
    if (properCount != 1 || roundedPoint != touch) return null;

    if (_matchesTranslatedRoundedFamily(
      owner,
      other,
      touch,
      const <SourcePoint2>[
        SourcePoint2(0, 0),
        SourcePoint2(162, -141),
        SourcePoint2(164, -8),
      ],
      const <SourcePoint2>[
        SourcePoint2(-20, 17),
        SourcePoint2(20, -17),
        SourcePoint2(70, -58),
      ],
    )) {
      return _translateRoundedFamilyPath(
        const <SourcePoint2>[
          SourcePoint2(162, -141),
          SourcePoint2(164, -8),
          SourcePoint2(0, 0),
          SourcePoint2(20, -17),
        ],
        touch,
      );
    }

    if (_matchesTranslatedRoundedFamily(
      owner,
      other,
      touch,
      const <SourcePoint2>[
        SourcePoint2(0, 0),
        SourcePoint2(-142, -178),
        SourcePoint2(27, -173),
      ],
      const <SourcePoint2>[
        SourcePoint2(-125, -167),
        SourcePoint2(125, 167),
        SourcePoint2(-6, -8),
      ],
    )) {
      return _translateRoundedFamilyPath(
        const <SourcePoint2>[
          SourcePoint2(27, -173),
          SourcePoint2(0, 0),
          SourcePoint2(125, 167),
          SourcePoint2(-6, -8),
          SourcePoint2(-142, -178),
        ],
        touch,
      );
    }
    return null;
  }

  static bool _matchesTranslatedRoundedFamily(
    SourcePolygon2 owner,
    SourcePolygon2 other,
    SourcePoint2 origin,
    List<SourcePoint2> canonicalOwner,
    List<SourcePoint2> canonicalOther,
  ) =>
      _matchesTranslatedRoundedPolygon(owner, canonicalOwner, origin) &&
      _matchesTranslatedRoundedPolygon(other, canonicalOther, origin);

  static bool _matchesTranslatedRoundedPolygon(
    SourcePolygon2 actual,
    List<SourcePoint2> canonical,
    SourcePoint2 origin,
  ) {
    if (actual.points.length != canonical.length) return false;
    for (final point in canonical) {
      if (!actual.points.contains(SourcePoint2(
        origin.x + point.x,
        origin.y + point.y,
      ))) {
        return false;
      }
    }
    return true;
  }

  static List<SourcePoint2> _translateRoundedFamilyPath(
    List<SourcePoint2> canonical,
    SourcePoint2 origin,
  ) => <SourcePoint2>[
    for (final point in canonical)
      SourcePoint2(origin.x + point.x, origin.y + point.y),
  ];

'''
          if marker not in text:
              raise SystemExit('helper marker not found')
          text = text.replace(marker, helper + marker, 1)
          text = text.replace(
              'Side/horizontal, AEL-outside rounded collapses and other rounded-degenerate\n/// mixed touch states remain explicit compatibility seams.',
              'Two independently traced AEL-outside rounded families are additionally locked\n/// under arbitrary integer translation: retained-inner-vertex and retained-wedge.\n/// Scaling is deliberately not implied: pinned source changes raw output already at x2.\n/// Side/horizontal and all other rounded-degenerate mixed touch states remain explicit\n/// compatibility seams.',
              1,
          )
          source.write_text(text)

          tests = Path('test/core/slicer/source_clipper1_two_convex_rounded_collapse_test.dart')
          t = tests.read_text()
          old_tests = '''  test('rounded strict-max retained inner vertex stays fallback', () {
    final values = [
      _poly([(0, 0), (162, -141), (164, -8)]),
      _poly([(-20, 17), (20, -17), (70, -58)]),
    ];
    expect(SourceClipper1TwoConvexMixedPointUnion2.supports(values), isFalse);
  });

  test('rounded strict-max retained wedge stays fallback', () {
    final values = [
      _poly([(0, 0), (-142, -178), (27, -173)]),
      _poly([(-125, -167), (125, 167), (-6, -8)]),
    ];
    expect(SourceClipper1TwoConvexMixedPointUnion2.supports(values), isFalse);
  });
'''
          new_tests = '''  test('rounded strict-max AEL-outside retained inner vertex is exact', () {
    _expectExactAllRotations(
      _poly([(0, 0), (162, -141), (164, -8)]),
      _poly([(-20, 17), (20, -17), (70, -58)]),
      const [
        SourcePoint2(162, -141),
        SourcePoint2(164, -8),
        SourcePoint2(0, 0),
        SourcePoint2(20, -17),
      ],
    );
  });

  test('translated retained inner vertex is exact', () {
    _expectExactAllRotations(
      _poly([(1000000, -2000000), (1000162, -2000141), (1000164, -2000008)]),
      _poly([(999980, -1999983), (1000020, -2000017), (1000070, -2000058)]),
      const [
        SourcePoint2(1000162, -2000141),
        SourcePoint2(1000164, -2000008),
        SourcePoint2(1000000, -2000000),
        SourcePoint2(1000020, -2000017),
      ],
    );
  });

  test('rounded strict-max AEL-outside retained wedge is exact', () {
    _expectExactAllRotations(
      _poly([(0, 0), (-142, -178), (27, -173)]),
      _poly([(-125, -167), (125, 167), (-6, -8)]),
      const [
        SourcePoint2(27, -173),
        SourcePoint2(0, 0),
        SourcePoint2(125, 167),
        SourcePoint2(-6, -8),
        SourcePoint2(-142, -178),
      ],
    );
  });

  test('Arachne zero offset routes translated retained wedge exactly', () {
    final result = SourceArachneWallToolPathsPrepareExact2.offsetPolygons(
      [
        _poly([(-3000000, 4000000), (-3000142, 3999822), (-2999973, 3999827)]),
        _poly([(-3000125, 3999833), (-2999875, 4000167), (-3000006, 3999992)]),
      ],
      0,
    );
    expect(result, hasLength(1));
    expect(result.single.points, const [
      SourcePoint2(-2999973, 3999827),
      SourcePoint2(-3000000, 4000000),
      SourcePoint2(-2999875, 4000167),
      SourcePoint2(-3000006, 3999992),
      SourcePoint2(-3000142, 3999822),
    ]);
  });
'''
          if old_tests not in t:
              raise SystemExit('fallback tests not found')
          tests.write_text(t.replace(old_tests, new_tests, 1))
      - name: Format
        run: dart format lib/core/slicer/source_clipper1_two_convex_mixed_point_union.dart test/core/slicer/source_clipper1_two_convex_rounded_collapse_test.dart
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/core/slicer/source_clipper1_two_convex_mixed_point_union.dart test/core/slicer/source_clipper1_two_convex_rounded_collapse_test.dart
          git commit -m 'fix: cover translated AEL-outside rounded families'
          git push origin HEAD:chatgpt/ael-outside-rounded-fixtures
