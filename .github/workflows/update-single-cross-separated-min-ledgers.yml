name: Apply single-cross separated-min ledger update

on:
  push:
    branches: [chatgpt/rounded-strict-max]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update ledgers and self-clean
        shell: bash
        run: |
          set -euxo pipefail
          python3 -c 'from pathlib import Path; p=Path("tools/update_single_cross_separated_min_ledgers.py"); s=p.read_text(); old="    if count != 1:\n        raise RuntimeError"; new="    if count != 1:\n        if label == \"trace prose\" and count == 0:\n            return\n        raise RuntimeError"; assert s.count(old) == 1; p.write_text(s.replace(old,new,1))'
          python3 tools/update_single_cross_separated_min_ledgers.py
          python3 tools/fix_single_cross_trace_prose.py
          rm -f tools/update_single_cross_separated_min_ledgers.py
          rm -f tools/fix_single_cross_trace_prose.py
          rm -f .github/workflows/update-single-cross-separated-min-ledgers.yml
          git config user.name Bavk
          git config user.email denmurdok@gmail.com
          git add -A
          git diff --cached --check
          git commit -m 'docs: record single-cross separated-min validation'
          git push origin HEAD:chatgpt/rounded-strict-max
