name: Fix AEL-outside lint

on:
  push:
    branches:
      - chatgpt/ael-outside-rounded-fixtures
    paths:
      - .github/workflows/fix-ael-outside-lint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ael-outside-rounded-fixtures
      - run: python3 tools/fix_ael_outside_lint.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/core/slicer/source_clipper1_two_convex_mixed_point_union.dart
          git commit -m 'style: satisfy rounded family lint'
          git push origin HEAD:chatgpt/ael-outside-rounded-fixtures
