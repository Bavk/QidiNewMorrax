name: Strict-max AEL-outside rounded oracle

on:
  push:
    branches: [chatgpt/ael-outside-rounded-strict-max]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Eigen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeigen3-dev

      - name: Build and run pinned Clipper1 probe
        shell: bash
        run: |
          set -euxo pipefail
          PIN=f2b55a5a83f266cf56e06c7943a81a08bebb7fad
          mkdir -p oracle/src/clipper oracle/src/libslic3r
          curl -fsSL "https://raw.githubusercontent.com/bambulab/BambuStudio/${PIN}/src/clipper/clipper.cpp" -o oracle/src/clipper/clipper.cpp
          curl -fsSL "https://raw.githubusercontent.com/bambulab/BambuStudio/${PIN}/src/clipper/clipper.hpp" -o oracle/src/clipper/clipper.hpp
          curl -fsSL "https://raw.githubusercontent.com/bambulab/BambuStudio/${PIN}/src/libslic3r/Int128.hpp" -o oracle/src/libslic3r/Int128.hpp
          g++ -std=c++17 -O2 -Ioracle/src -I/usr/include/eigen3 oracle/src/clipper/clipper.cpp tools/strict_max_ael_outside_rounded_probe.cpp -o oracle/strict_max_ael_outside_rounded_probe
          ./oracle/strict_max_ael_outside_rounded_probe
