name: Linux packaged release smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-verify-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FLUTTER_VERSION: '3.47.2'
      ORCA_VERSION: '2.4.2'
      ORCA_PIN: '8500fcdccaa10b5099ac20d252af3a7c560046f1'
      ORCA_APPIMAGE_SHA256: 'd12fb8c8eac1aecd2dfb6377acd48f994f8fa439ed5292fa532dd82880f029fd'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libopengl0 \
            libglu1-mesa \
            libwebkit2gtk-4.1-0 \
            libjavascriptcoregtk-4.1-0 \
            xvfb

      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$HOME/flutter"

      - name: Generate Linux desktop scaffold
        shell: bash
        run: |
          set -euxo pipefail
          flutter config --no-analytics --enable-linux-desktop
          flutter --version
          flutter create \
            --platforms=linux \
            --project-name qidi_flow_flutter \
            --org com.bavk \
            --no-pub \
            .
          flutter pub get

      - name: Prepare pinned QIDI profile catalog
        shell: bash
        run: |
          set -euxo pipefail
          orca_source="orcaslicer-source-${ORCA_PIN}.tar.gz"
          curl -fL --retry 3 \
            "https://github.com/OrcaSlicer/OrcaSlicer/archive/${ORCA_PIN}.tar.gz" \
            -o "$orca_source"
          rm -rf .orca-source
          mkdir -p .orca-source
          tar -xzf "$orca_source" -C .orca-source --strip-components=1

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.orca-source/resources/profiles/Qidi')
          assert root.is_dir(), f'missing pinned QIDI profile tree: {root}'
          profiles = []
          for path in sorted(root.rglob('*.json')):
              try:
                  values = json.loads(path.read_text(encoding='utf-8-sig'))
              except Exception as exc:
                  raise RuntimeError(f'failed to parse {path}: {exc}') from exc
              if not isinstance(values, dict) or not values.get('name'):
                  continue
              profiles.append({
                  'assetPath': 'pinned-orca/' + path.relative_to(root).as_posix(),
                  'values': values,
              })

          required = {
              'Qidi X-Plus 4 0.4 nozzle',
              '0.20mm Standard @Qidi XPlus4',
              'Qidi Generic PLA @Qidi X-Plus 4 0.4 nozzle',
              'QIDI PETG Basic @Qidi X-Plus 4 0.4 nozzle',
          }
          names = {entry['values']['name'] for entry in profiles}
          missing = sorted(required - names)
          assert not missing, f'missing v0.1 profiles: {missing}'

          output = Path('assets/generated/profile_catalog.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(profiles, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          print(f'wrote {len(profiles)} pinned QIDI profiles to {output}')
          PY

          test -s assets/generated/profile_catalog.json

      - name: Build Flutter Linux release
        shell: bash
        run: |
          set -euxo pipefail
          flutter build linux --release
          bundle="$PWD/build/linux/x64/release/bundle"
          test -x "$bundle/qidi_flow_flutter"
          test -d "$bundle/data/flutter_assets"

      - name: Bundle pinned OrcaSlicer
        shell: bash
        run: |
          set -euxo pipefail
          bundle="$PWD/build/linux/x64/release/bundle"
          mkdir -p "$bundle/orca"
          curl -fL --retry 3 \
            "https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v${ORCA_VERSION}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V${ORCA_VERSION}.AppImage" \
            -o "$bundle/orca/OrcaSlicer.AppImage"
          echo "${ORCA_APPIMAGE_SHA256}  $bundle/orca/OrcaSlicer.AppImage" \
            | sha256sum -c -
          chmod +x "$bundle/orca/OrcaSlicer.AppImage"
          cp packaging/orca/linux/orca-engine.json "$bundle/orca/orca-engine.json"

      - name: Verify packaged runtime discovery and provenance
        shell: bash
        run: |
          set -euxo pipefail
          bundle="$PWD/build/linux/x64/release/bundle"
          dart run tool/verify_packaged_orca.dart "$bundle/qidi_flow_flutter"

      - name: Run packaged offline application smoke
        shell: bash
        run: |
          set -euxo pipefail
          bundle="$PWD/build/linux/x64/release/bundle"
          mkdir -p packaged-smoke
          cat > packaged-smoke/model.stl <<'STL'
          solid tetra
            facet normal 0 0 -1
              outer loop
                vertex 0 0 0
                vertex 20 0 0
                vertex 0 20 0
              endloop
            endfacet
            facet normal 0 -1 1
              outer loop
                vertex 0 0 0
                vertex 20 0 0
                vertex 0 0 20
              endloop
            endfacet
            facet normal 1 1 1
              outer loop
                vertex 20 0 0
                vertex 0 20 0
                vertex 0 0 20
              endloop
            endfacet
            facet normal -1 0 1
              outer loop
                vertex 0 20 0
                vertex 0 0 0
                vertex 0 0 20
              endloop
            endfacet
          endsolid tetra
          STL

          result="$PWD/packaged-smoke/result.json"
          env -u ORCA_SLICER_BIN \
            QIDI_PACKAGED_OFFLINE_SMOKE_MODEL="$PWD/packaged-smoke/model.stl" \
            QIDI_PACKAGED_OFFLINE_SMOKE_RESULT="$result" \
            xvfb-run -a "$bundle/qidi_flow_flutter"

          test -s "$result"
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('packaged-smoke/result.json').read_text())
          assert result['success'] is True, result
          assert result['packaged_engine_verified'] is True, result
          assert result['preview_ready'] is True, result
          assert result['model_triangles'] == 4, result
          assert result['selected_plate'] == 1, result
          assert result['move_count'] > 0, result
          assert result['extrusion_move_count'] > 0, result
          assert result['prediction_seconds'] > 0, result
          assert result['filament_meters'] > 0, result
          assert result['filament_slot_count'] == 2, result
          assert result['primary_filament'] == (
              'Qidi Generic PLA @Qidi X-Plus 4 0.4 nozzle'
          ), result
          assert result['secondary_filament'] == (
              'QIDI PETG Basic @Qidi X-Plus 4 0.4 nozzle'
          ), result
          assert result['object_extruder'] == 1, result
          assert result['paint_color'] == '8', result
          assert result['engine_executable'].endswith(
              '/orca/OrcaSlicer.AppImage'
          ), result
          assert Path(result['bundle_path']).is_file(), result
          assert Path(result['gcode_path']).is_file(), result
          print(json.dumps(result, indent=2))
          PY

      - name: Prepare legal notices and corresponding source
        shell: bash
        run: |
          set -euxo pipefail
          bundle="$PWD/build/linux/x64/release/bundle"
          mkdir -p "$bundle/legal"
          cp LICENSE "$bundle/legal/AGPL-3.0.txt"
          cp packaging/legal/RELEASE-NOTICES.txt \
            "$bundle/legal/RELEASE-NOTICES.txt"

          git archive \
            --format=tar.gz \
            --prefix="QidiNewMorrax-${GITHUB_SHA}/" \
            -o qidi-new-morrax-source.tar.gz \
            HEAD

          orca_source="orcaslicer-source-${ORCA_PIN}.tar.gz"

          test -s qidi-new-morrax-source.tar.gz
          test -s "$orca_source"
          tar -tzf qidi-new-morrax-source.tar.gz > qidi-source-archive.txt
          tar -tzf "$orca_source" > orca-source-archive.txt
          grep -q '/LICENSE$' qidi-source-archive.txt
          grep -q '/packaging/legal/RELEASE-NOTICES.txt$' qidi-source-archive.txt
          grep -q '/LICENSE.txt$' orca-source-archive.txt
          grep -q '/src/' orca-source-archive.txt
          grep -q '/resources/' orca-source-archive.txt

          qidi_source_sha="$(sha256sum qidi-new-morrax-source.tar.gz | cut -d' ' -f1)"
          orca_source_sha="$(sha256sum "$orca_source" | cut -d' ' -f1)"
          cat > "$bundle/legal/SOURCE-MANIFEST.txt" <<EOF
          QidiNewMorrax binary commit: ${GITHUB_SHA}
          QidiNewMorrax source archive: qidi-new-morrax-source.tar.gz
          QidiNewMorrax source SHA-256: ${qidi_source_sha}

          OrcaSlicer version: ${ORCA_VERSION}
          OrcaSlicer source commit: ${ORCA_PIN}
          OrcaSlicer source archive: ${orca_source}
          OrcaSlicer source SHA-256: ${orca_source_sha}

          These source archives are uploaded alongside the binary release
          materials by this workflow.
          EOF


      - name: Create portable release archive
        shell: bash
        run: |
          set -euxo pipefail
          tar \
            -C build/linux/x64/release \
            -czf qidi-new-morrax-linux-x64.tar.gz \
            bundle
          test -s qidi-new-morrax-linux-x64.tar.gz
          tar -tzf qidi-new-morrax-linux-x64.tar.gz > release-archive.txt
          grep -q '^bundle/orca/OrcaSlicer.AppImage$' release-archive.txt
          grep -q '^bundle/orca/orca-engine.json$' release-archive.txt
          grep -q '^bundle/legal/AGPL-3.0.txt$' release-archive.txt
          grep -q '^bundle/legal/RELEASE-NOTICES.txt$' release-archive.txt
          grep -q '^bundle/legal/SOURCE-MANIFEST.txt$' release-archive.txt

      - name: Upload Linux release materials
        uses: actions/upload-artifact@v4
        with:
          name: qidi-new-morrax-linux-x64-release
          path: |
            qidi-new-morrax-linux-x64.tar.gz
            qidi-new-morrax-source.tar.gz
            orcaslicer-source-${{ env.ORCA_PIN }}.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Attach binary and corresponding source to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release upload "${{ github.event.release.tag_name }}" \
            qidi-new-morrax-linux-x64.tar.gz \
            qidi-new-morrax-source.tar.gz \
            "orcaslicer-source-${ORCA_PIN}.tar.gz" \
            --clobber
