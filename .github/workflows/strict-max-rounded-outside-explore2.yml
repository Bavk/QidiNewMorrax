name: Strict-max rounded AEL-outside classify

on:
  push:
    branches:
      - chatgpt/rounded-ael-outside
  workflow_dispatch:

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Eigen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeigen3-dev
      - name: Build and classify pinned Clipper1
        shell: bash
        run: |
          set -euxo pipefail
          PIN=f2b55a5a83f266cf56e06c7943a81a08bebb7fad
          BASE=cb5886f03cafafb26e7047878375840f6ce57dc8
          mkdir -p oracle/src/clipper oracle/src/libslic3r
          curl -fsSL "https://raw.githubusercontent.com/bambulab/BambuStudio/${PIN}/src/clipper/clipper.cpp" -o oracle/src/clipper/clipper.cpp
          curl -fsSL "https://raw.githubusercontent.com/bambulab/BambuStudio/${PIN}/src/clipper/clipper.hpp" -o oracle/src/clipper/clipper.hpp
          curl -fsSL "https://raw.githubusercontent.com/bambulab/BambuStudio/${PIN}/src/libslic3r/Int128.hpp" -o oracle/src/libslic3r/Int128.hpp
          curl -fsSL "https://raw.githubusercontent.com/Bavk/QidiNewMorrax/${BASE}/tools/strict_max_rounded_touch_collapse_probe.cpp" -o /tmp/base.cpp
          sed '/^int main()/,$d' /tmp/base.cpp > /tmp/outside.cpp
          sed -i '1i#include <map>' /tmp/outside.cpp
          cat >> /tmp/outside.cpp <<'CPP'
          static std::string label_point(const Path &owner, const Path &other, const IntPoint &p) {
            for (int i = 0; i < 3; ++i) if (same(owner[i], p)) return "O" + std::to_string(i);
            for (int i = 0; i < 3; ++i) if (same(other[i], p)) return "T" + std::to_string(i);
            return "X";
          }

          static std::string labels(const Path &owner, const Path &other, const Path &raw) {
            std::ostringstream out;
            for (size_t i = 0; i < raw.size(); ++i) {
              if (i) out << ",";
              out << label_point(owner, other, raw[i]);
            }
            return out.str();
          }

          static std::string relation_signature(const Path &owner, const Path &other,
                                                const IntPoint &touch, int touch_edge,
                                                const CollapsePair &collapse) {
            const Edge outgoing = edge_from(owner[0], owner[1]);
            const Edge incoming = edge_from(owner[2], owner[0]);
            const Edge &left = outgoing.dx > incoming.dx ? outgoing : incoming;
            const Edge &right = outgoing.dx > incoming.dx ? incoming : outgoing;
            const Edge touched = edge_from(other[touch_edge], other[(touch_edge + 1) % 3]);
            const Edge crossing = edge_from(other[collapse.other_edge],
                                            other[(collapse.other_edge + 1) % 3]);
            auto bits = [&](const Edge &active) {
              std::string s;
              s += e2_inserts_before_e1(active, left, touch.y()) ? 'L' : '-';
              s += e2_inserts_before_e1(active, right, touch.y()) ? 'R' : '-';
              return s;
            };
            return "T" + bits(touched) + "C" + bits(crossing);
          }

          int main() {
            std::mt19937_64 rng(0x6170AEULL);
            std::uniform_int_distribution<int> coord(-180, 180);
            std::uniform_int_distribution<int> neg_y(-180, -1);
            const IntPoint touch(0, 0);
            long long attempts = 0;
            int candidates = 0;
            int outside = 0;
            int printed = 0;
            std::map<std::string, int> classes;

            while (attempts < 16000000 && outside < 1600) {
              ++attempts;
              IntPoint p(coord(rng), neg_y(rng));
              IntPoint q(coord(rng), neg_y(rng));
              if (same(p, q) || cross(touch, p, q) == 0 || p.y() == q.y()) continue;
              Path owner{touch, p, q};
              make_positive(owner);
              if (!strict_positive_triangle(owner)) continue;

              int ex = coord(rng);
              int ey = coord(rng);
              if ((ex == 0 && ey == 0) || ey == 0) continue;
              IntPoint u(-ex, -ey);
              IntPoint v(ex, ey);
              IntPoint w(coord(rng), coord(rng));
              if (same(w, u) || same(w, v) || cross(u, v, w) == 0) continue;
              Path other{u, v, w};
              make_positive(other);
              if (!strict_positive_triangle(other)) continue;

              const long long owner_min_y = std::min(owner[1].y(), owner[2].y());
              if (w.y() <= owner_min_y) continue;
              if (u.y() == owner_min_y || v.y() == owner_min_y) continue;

              int proper_count = 0;
              IntPoint found_touch;
              if (!one_unique_touch_no_overlap(owner, other, proper_count, found_touch)) continue;
              if (!same(found_touch, touch) || proper_count != 1) continue;
              const int touch_edge = strict_touch_edge(other, touch);
              if (touch_edge < 0) continue;
              const CollapsePair collapse = touch_collapse_pair(owner, other, touch);
              if (collapse.owner_edge < 0 || collapse.other_edge < 0) continue;
              ++candidates;

              int inside_count = 0;
              for (const IntPoint &point : other) if (strictly_inside(owner, point)) ++inside_count;
              const bool surrounded = owner_bounds_surround_active_other_edges(
                  owner, other, touch, touch_edge, collapse);
              if (surrounded && inside_count == 2) continue;

              Path raw;
              if (!source_union(owner, other, raw)) continue;
              ++outside;
              const std::string rel = relation_signature(owner, other, touch, touch_edge, collapse);
              const std::string lab = labels(owner, other, raw);
              const std::string key = "inside=" + std::to_string(inside_count) +
                  " rel=" + rel + " edge=" + std::to_string(collapse.owner_edge) +
                  " n=" + std::to_string(raw.size()) + " raw=" + lab;
              ++classes[key];
              if (printed < 60) {
                ++printed;
                std::cout << "CASE " << printed
                          << " inside=" << inside_count
                          << " surrounded=" << surrounded
                          << " rel=" << rel
                          << " edge=" << collapse.owner_edge
                          << " touchEdge=" << touch_edge
                          << " crossEdge=" << collapse.other_edge
                          << " owner=" << path_string(owner)
                          << " other=" << path_string(other)
                          << " raw=" << path_string(raw)
                          << " labels=" << lab << "\n";
              }
            }

            std::vector<std::pair<int,std::string>> ordered;
            for (const auto &entry : classes) ordered.push_back({entry.second, entry.first});
            std::sort(ordered.rbegin(), ordered.rend());
            std::cout << "SUMMARY attempts=" << attempts << " candidates=" << candidates
                      << " outside=" << outside << " classes=" << classes.size() << "\n";
            int shown = 0;
            for (const auto &entry : ordered) {
              if (shown++ >= 60) break;
              std::cout << "CLASS count=" << entry.first << " " << entry.second << "\n";
            }
            return outside >= 300 ? 0 : 2;
          }
          CPP
          g++ -std=c++17 -O2 -Ioracle/src -I/usr/include/eigen3 oracle/src/clipper/clipper.cpp /tmp/outside.cpp -o oracle/outside
          ./oracle/outside
