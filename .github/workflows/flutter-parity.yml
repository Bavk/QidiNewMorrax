name: Flutter parity validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLUTTER_VERSION: '3.47.2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Flutter from official repository
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$HOME/flutter"

      - name: Toolchain identity
        shell: bash
        run: |
          flutter config --no-analytics
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit and parity tests
        run: flutter test --reporter expanded
