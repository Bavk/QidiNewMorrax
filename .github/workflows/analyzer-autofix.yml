name: One-shot analyzer cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyzer-autofix.yml'

permissions:
  contents: write

jobs:
  fix-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLUTTER_VERSION: '3.47.2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exact analyzer fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old!r}')
              p.write_text(text.replace(old, new))

          def replace_regex(path, pattern, replacement, expected=1):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, flags=re.MULTILINE)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} regex match(es), found {count}: {pattern!r}')
              p.write_text(updated)

          def replace_after(path, anchor, old, new):
              p = Path(path)
              text = p.read_text()
              anchor_count = text.count(anchor)
              if anchor_count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {anchor_count}: {anchor!r}')
              start = text.index(anchor) + len(anchor)
              pos = text.find(old, start)
              if pos < 0:
                  raise SystemExit(f'{path}: target not found after anchor: {old!r}')
              if text.find(old, pos + len(old)) >= 0:
                  # Multiple later matches are allowed only outside the anchored section;
                  # this replacement still changes exactly the first one after anchor.
                  pass
              text = text[:pos] + new + text[pos + len(old):]
              p.write_text(text)

          replace(
              'lib/features/device/data/local_device_discovery.dart',
              '''    final subscription = socket.listen((event) {
                if (event != RawSocketEvent.read) return;
                Datagram? datagram;
                while ((datagram = socket.receive()) != null) {
                  final raw = utf8.decode(datagram.data, allowMalformed: true);
                  final parsed = _parseSsdp(raw, datagram.address.address);
                  if (parsed != null) found[parsed.ip] = parsed;
                }
              });''',
              '''    final subscription = socket.listen((event) {
                if (event != RawSocketEvent.read) return;
                while (true) {
                  final datagram = socket.receive();
                  if (datagram == null) break;
                  final raw = utf8.decode(datagram.data, allowMalformed: true);
                  final parsed = _parseSsdp(raw, datagram.address.address);
                  if (parsed != null) found[parsed.ip] = parsed;
                }
              });''',
          )

          replace_regex(
              'lib/core/slicer/extrusion_entity.dart',
              r'''  ExtrusionPathOriented2\(\{\n    required ExtrusionRole role,\n    required double mm3PerMm,\n    required double width,\n    required double height,\n    SourcePolyline2\? polyline,\n  \}\) : super\(\n\s+role: role,\n\s+mm3PerMm: mm3PerMm,\n\s+width: width,\n\s+height: height,\n\s+polyline: polyline,\n\s+canReverse: false,\n\s+\);''',
              '''  ExtrusionPathOriented2({
                required super.role,
                required super.mm3PerMm,
                required super.width,
                required super.height,
                super.polyline,
              }) : super(canReverse: false);''',
          )

          replace(
              'lib/features/device/presentation/device_page.dart',
              '              value: selected != null && controller.devices.contains(selected)\n',
              '              initialValue: selected != null && controller.devices.contains(selected)\n',
          )
          replace_after(
              'lib/features/device/presentation/device_page.dart',
              'await widget.controller.listTimelapses();',
              'context: context,',
              'context: this.context,',
          )
          replace_after(
              'lib/features/device/presentation/device_page.dart',
              'await widget.controller.listTimelapses();',
              'ScaffoldMessenger.of(context).showSnackBar(',
              'ScaffoldMessenger.of(this.context).showSnackBar(',
          )

          replace(
              'lib/features/prepare/presentation/prepare_page.dart',
              '      value: availableValue,\n',
              '      initialValue: availableValue,\n',
          )
          replace(
              'lib/features/prepare/presentation/prepare_page.dart',
              'Colors.white.withOpacity(.18)',
              'Colors.white.withValues(alpha: .18)',
          )
          replace(
              'lib/features/prepare/presentation/prepare_page.dart',
              'Colors.white.withOpacity(.35)',
              'Colors.white.withValues(alpha: .35)',
          )
          replace(
              'lib/features/prepare/presentation/prepare_page.dart',
              'const Color(0xFF0875EE).withOpacity(.85)',
              'const Color(0xFF0875EE).withValues(alpha: .85)',
          )

          replace(
              'lib/features/preview/presentation/preview_page.dart',
              '_ToolpathPainter(layer: current!),',
              '_ToolpathPainter(layer: current),',
          )
          replace(
              'lib/features/preview/presentation/preview_page.dart',
              'Colors.white.withOpacity(.18)',
              'Colors.white.withValues(alpha: .18)',
          )
          PY

      - name: Install pinned Flutter from official repository
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$HOME/flutter"

      - name: Format and validate
        shell: bash
        run: |
          set -euxo pipefail
          flutter config --no-analytics
          dart format \
            lib/features/device/data/local_device_discovery.dart \
            lib/core/slicer/extrusion_entity.dart \
            lib/features/device/presentation/device_page.dart \
            lib/features/prepare/presentation/prepare_page.dart \
            lib/features/preview/presentation/preview_page.dart
          flutter pub get
          flutter analyze
          flutter test --reporter expanded
          git diff --check

      - name: Commit validated cleanup
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/device/data/local_device_discovery.dart \
            lib/core/slicer/extrusion_entity.dart \
            lib/features/device/presentation/device_page.dart \
            lib/features/prepare/presentation/prepare_page.dart \
            lib/features/preview/presentation/preview_page.dart
          git commit -m 'chore: finish analyzer cleanup'
          git push origin HEAD:main
