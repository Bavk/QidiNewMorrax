name: Late strict-max separated-min oracle

on:
  push:
    branches: [chatgpt/late-strict-max-multicross]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Eigen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeigen3-dev

      - name: Build and run pinned Clipper1 boundary probe
        shell: bash
        run: |
          set -euxo pipefail
          PIN=f2b55a5a83f266cf56e06c7943a81a08bebb7fad
          mkdir -p oracle/src/clipper oracle/src/libslic3r
          curl -fsSL "https://raw.githubusercontent.com/bambulab/BambuStudio/${PIN}/src/clipper/clipper.cpp" -o oracle/src/clipper/clipper.cpp
          curl -fsSL "https://raw.githubusercontent.com/bambulab/BambuStudio/${PIN}/src/clipper/clipper.hpp" -o oracle/src/clipper/clipper.hpp
          curl -fsSL "https://raw.githubusercontent.com/bambulab/BambuStudio/${PIN}/src/libslic3r/Int128.hpp" -o oracle/src/libslic3r/Int128.hpp
          sed -i 's/long long min_y = raw.front().y()/int min_y = raw.front().y()/g' tools/late_strict_max_separated_min_probe.cpp
          g++ -std=c++17 -O2 -Ioracle/src -I/usr/include/eigen3 oracle/src/clipper/clipper.cpp tools/late_strict_max_separated_min_probe.cpp -o oracle/late_strict_max_separated_min_probe
          ./oracle/late_strict_max_separated_min_probe

      - name: Apply proved boundary and remove temporary oracle files
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/apply_late_multicross_boundary.py
          rm -f tools/apply_late_multicross_boundary.py
          rm -f tools/late_strict_max_separated_min_probe.cpp
          rm -f .github/workflows/late-strict-max-separated-min-oracle.yml
          rm -rf oracle
          git config user.name Bavk
          git config user.email denmurdok@gmail.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: cover late multicross separated minima'
          git push origin HEAD:chatgpt/late-strict-max-multicross
