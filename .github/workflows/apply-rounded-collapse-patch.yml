name: Apply rounded collapse patch

on:
  push:
    branches:
      - chatgpt/rounded-degenerate-strict-max

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rounded-degenerate-strict-max
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply_rounded_collapse_patch.py
      - name: Commit patch
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add lib/core/slicer/source_clipper1_two_convex_mixed_point_union.dart test/core/slicer/source_clipper1_two_convex_rounded_collapse_test.dart
          git commit -m "fix: cover AEL-contained rounded strict-max collapse"
          git push origin HEAD:chatgpt/rounded-degenerate-strict-max